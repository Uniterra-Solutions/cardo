name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: false
        type: string

permissions:
  contents: write

# The desktop app is built ON THE USER'S MACHINE from the release's source
# tarball by `cardo setup` (download source → pnpm install → build → package
# .app → install built-ins → launch). CI only publishes the CLI; GitHub
# auto-generates the source archive that `cardo setup` consumes.
jobs:
  release-cli:
    name: Publish CLI to npm (trusted publishing)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # npm trusted publishing (OIDC exchange) requires npm CLI >= 11.5.1;
      # Node 22 ships npm 10.x which cannot authenticate via OIDC (ENEEDAUTH).
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Extract version from tag
        id: version
        run: |
          REF_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          echo "ref_name=${REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify CLI package version matches tag
        run: |
          PKG_VERSION="$(node -p "require('./packages/cardo-cli/package.json').version")"
          if [ "$PKG_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "package.json version ($PKG_VERSION) != tag version (${{ steps.version.outputs.version }})" >&2
            exit 1
          fi

      # Build BEFORE lint: workspace packages (@cardo/cardo-updater etc.) are
      # consumed via their dist/ outputs, which are gitignored build products.
      # Linting before building leaves their types unresolved and type-aware
      # rules (no-unsafe-*) fail on the fresh checkout.
      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Check if version already published
        id: check
        env:
          PACKAGE_NAME: '@uniterra-solutions/cardo'
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "${PACKAGE_NAME}@${RELEASE_VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version ${RELEASE_VERSION} already published — skipping npm publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.check.outputs.exists != 'true'
        working-directory: packages/cardo-cli
        # Trusted publishing (OIDC, npm >= 11.5.1) authenticates via the GitHub
        # OIDC token and auto-generates provenance — no --provenance flag and
        # no NODE_AUTH_TOKEN needed.
        run: npm publish --access public

      # The desktop app is built ON THE USER'S MACHINE from the release's
      # source archive by `cardo setup`; CI publishes the CLI and creates the
      # GitHub Release so `releases/latest` (which `cardo setup` resolves)
      # points at the newest tag. Idempotent: re-running a release (e.g.
      # workflow_dispatch) skips if the tag's release already exists.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REF_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          if gh release view "$REF_NAME" >/dev/null 2>&1; then
            echo "Release $REF_NAME already exists — skipping."
          else
            gh release create "$REF_NAME" \
              --title "$REF_NAME" \
              --generate-notes
          fi
