name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release-cli:
    name: Publish CLI to npm (trusted publishing)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # npm trusted publishing (OIDC exchange) requires npm CLI >= 11.5.1;
      # Node 22 ships npm 10.x which cannot authenticate via OIDC (ENEEDAUTH).
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Extract version from tag
        id: version
        run: |
          REF_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          echo "ref_name=${REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify CLI package version matches tag
        run: |
          PKG_VERSION="$(node -p "require('./packages/cardo-cli/package.json').version")"
          if [ "$PKG_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "package.json version ($PKG_VERSION) != tag version (${{ steps.version.outputs.version }})" >&2
            exit 1
          fi

      # Build BEFORE lint: workspace packages (@cardo/cardo-updater etc.) are
      # consumed via their dist/ outputs, which are gitignored build products.
      # Linting before building leaves their types unresolved and type-aware
      # rules (no-unsafe-*) fail on the fresh checkout.
      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Check if version already published
        id: check
        env:
          PACKAGE_NAME: '@uniterra-solutions/cardo'
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "${PACKAGE_NAME}@${RELEASE_VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version ${RELEASE_VERSION} already published — skipping npm publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.check.outputs.exists != 'true'
        working-directory: packages/cardo-cli
        # Trusted publishing (OIDC, npm >= 11.5.1) authenticates via the GitHub
        # OIDC token and auto-generates provenance — no --provenance flag and
        # no NODE_AUTH_TOKEN needed.
        run: npm publish --access public

  release-desktop:
    name: Build macOS app and attach to GitHub Release
    runs-on: macos-latest
    timeout-minutes: 60
    needs: [release-cli]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Extract version from tag
        id: version
        run: |
          REF_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          echo "ref_name=${REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build cardo packages
        run: pnpm run build

      - name: Build + package desktop app (prepares dsh runtime, electron-builder)
        env:
          # pnpm 11 runs a deps-status check inside electron-builder's
          # `pnpm install --production`; disable it (runtime is pre-built).
          PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: 'false'
          # Name the artifact with the tag version (Cardo-<version>-arm64-mac.zip).
          CARDO_BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          pnpm --filter @cardo/cardo-desktop run package

      - name: Attach artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.ref_name }}
          files: |
            packages/cardo-desktop/dist/*.zip
          generate_release_notes: true
