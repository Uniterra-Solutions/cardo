name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: false
        type: string

permissions:
  contents: write

# Release gate. The CLI publishes only after the full verification matrix
# passes on the exact commit being released:
#   - ci: lint / typecheck / tests (the shared CI workflow),
#   - verify-cli-container: the installer flow in a clean Linux container
#     (pristine source → pnpm install → build → runtime-dependency + dsh boot
#     assertions),
#   - verify-windows-install: the real Windows install on windows-latest
#     (relocate checkout to the TEMP volume → pnpm install/build on Windows →
#     uniterra setup --source --move-source → electron-builder --win --dir →
#     move-embedded source → Start Menu shortcut → Uniterra.exe boot smoke).
# The publish job builds the workspace on Linux and uploads the built tree as
# the `uniterra-src-<tag>.tar.gz` release asset (dist/lib + `.uniterra-prebuilt`
# marker), so `uniterra setup` skips the build on user machines; releases without
# the asset still build from the auto-generated archive. Both installer flows
# must be proven before the source asset becomes the release artifact.

jobs:
  ci:
    name: Lint / typecheck / tests
    uses: ./.github/workflows/ci.yml

  verify-cli-container:
    name: Installer flow (clean Linux container)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Run container verification
        run: scripts/verify-cli-container/run.sh

  verify-windows-install:
    name: Windows install (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # Pin the pnpm store to the runner temp volume BEFORE setup-node: the
      # default store path on the windows image resolves to D:\.pnpm-store and
      # drifts when the verification relocates the checkout, so setup-node's
      # computed cache path (from `pnpm store path`) and the store installs
      # actually use can disagree — its post-run cache save then fails with
      # "Path Validation Error". An explicit absolute store makes both agree.
      - name: Pin the pnpm store to the temp volume
        shell: pwsh
        run: pnpm config set store-dir "$env:RUNNER_TEMP\pnpm-store"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # electron-builder downloads the electron dist + winCodeSign from
      # GitHub on first use; caching them keeps release retries fast.
      - name: Cache electron / electron-builder downloads
        uses: actions/cache@v6
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: win-electron-cache-${{ runner.os }}-${{ hashFiles('packages/uniterra-desktop/package.json') }}
      - name: Run Windows verification
        shell: pwsh
        run: scripts/verify-windows-install/verify.ps1

  publish:
    name: Publish CLI to npm + create GitHub release
    runs-on: ubuntu-latest
    needs: [ci, verify-cli-container, verify-windows-install]
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # npm trusted publishing (OIDC exchange) requires npm CLI >= 11.5.1;
      # Node 22 ships npm 10.x which cannot authenticate via OIDC (ENEEDAUTH).
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Extract version from tag
        id: version
        run: |
          REF_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          echo "ref_name=${REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify CLI package version matches tag
        run: |
          PKG_VERSION="$(node -p "require('./packages/uniterra-cli/package.json').version")"
          if [ "$PKG_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "package.json version ($PKG_VERSION) != tag version (${{ steps.version.outputs.version }})" >&2
            exit 1
          fi

      # The source asset ships these artifacts; the CLI skips `pnpm run build`
      # when it downloads them (tsc/esbuild output is platform-independent, so
      # one Linux-built tree serves both macOS and Windows installs).
      - name: Build workspace (prebuilt artifacts for the source asset)
        run: pnpm run build

      - name: Package the source asset (built tree + prebuilt marker)
        env:
          REF_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: scripts/make-source-asset.sh "$REF_NAME"

      - name: Check if version already published
        id: check
        env:
          PACKAGE_NAME: '@uniterra-solutions/uniterra'
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "${PACKAGE_NAME}@${RELEASE_VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version ${RELEASE_VERSION} already published — skipping npm publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.check.outputs.exists != 'true'
        working-directory: packages/uniterra-cli
        # Trusted publishing (OIDC, npm >= 11.5.1) authenticates via the GitHub
        # OIDC token and auto-generates provenance — no --provenance flag and
        # no NODE_AUTH_TOKEN needed.
        run: npm publish --access public

      # Idempotent: re-running a release (e.g. workflow_dispatch) skips if the
      # tag's release already exists.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REF_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          if gh release view "$REF_NAME" >/dev/null 2>&1; then
            echo "Release $REF_NAME already exists — skipping."
          else
            gh release create "$REF_NAME" \
              --title "$REF_NAME" \
              --generate-notes
          fi

      # The desktop artifact: the built source tree. `uniterra setup` downloads
      # this asset and skips the build; the auto-generated archive remains the
      # fallback for releases created without it.
      - name: Upload the source asset
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release upload "$REF_NAME" "uniterra-src-${REF_NAME}.tar.gz" --clobber
