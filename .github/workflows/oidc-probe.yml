name: OIDC Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Check OIDC env availability
        run: |
          echo "url_set=$([ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo yes || echo no)"
          echo "token_set=$([ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ] && echo yes || echo no)"
      - name: Request OIDC token (audience sigstore) and print claims
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ] || [ -z "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            echo 'OIDC env missing - cannot request token'
            exit 0
          fi
          curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sigstore" | python3 -c '
          import json, sys, base64
          jwt = json.load(sys.stdin)["value"]
          parts = jwt.split(".")
          payload = json.loads(base64.urlsafe_b64decode(parts[1] + "=" * (-len(parts[1]) % 4)))
          keys = ["job_workflow_ref", "repository", "repository_owner", "ref", "ref_type", "aud"]
          print(json.dumps({k: payload.get(k) for k in keys}, indent=2))
          '
