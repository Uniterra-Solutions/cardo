name: OIDC Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Request OIDC token (audience sigstore) and exchange at npm registry
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ] || [ -z "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            echo 'OIDC env missing - cannot request token'
            exit 0
          fi
          JWT=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sigstore" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          echo "=== github claims ==="
          python3 -c '
          import json, sys, base64
          jwt = sys.argv[1]
          parts = jwt.split(".")
          payload = json.loads(base64.urlsafe_b64decode(parts[1] + "=" * (-len(parts[1]) % 4)))
          print(json.dumps({k: payload.get(k) for k in ["job_workflow_ref", "repository", "repository_owner", "ref", "ref_type"]}, indent=2))
          ' "$JWT"
          echo "=== npm registry exchange ==="
          for path in "-/npm/v1/oidc/token" "-/npm/v1/tokens" "-/npm/v1/oidc"; do
            echo "--- POST https://registry.npmjs.org/$path ---"
            curl -sS -w "\nHTTP_STATUS:%{http_code}\n" \
              -X POST "https://registry.npmjs.org/$path" \
              -H "content-type: application/json" \
              -d "{\"token\":\"$JWT\"}" | head -c 1200
            echo
          done
